<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Task Manager</title>
</head>
<body>
	<main>
		<h1>Task Manager</h1>

		<section aria-labelledby="add-task-heading">
			<h2 id="add-task-heading">Add a task</h2>
			<form id="task-form">
				<p>
					<label for="task-title">Task</label><br>
					<input id="task-title" name="title" type="text" required maxlength="120" placeholder="What needs to be done?">
				</p>
				<p>
					<label for="task-details">Details (optional)</label><br>
					<textarea id="task-details" name="details" rows="3" maxlength="500"></textarea>
				</p>
				<p>
					<label for="task-due-date">Due date (optional)</label><br>
					<input id="task-due-date" name="dueDate" type="date">
				</p>
				<p>
					<label for="task-priority">Priority</label><br>
					<select id="task-priority" name="priority">
						<option value="Low">Low</option>
						<option value="Medium" selected>Medium</option>
						<option value="High">High</option>
					</select>
				</p>
				<button type="submit">Add task</button>
			</form>
		</section>

		<section aria-labelledby="tasks-heading">
			<h2 id="tasks-heading">Your tasks</h2>
			<p>
				<label for="task-search">Search tasks</label><br>
				<input id="task-search" type="search" placeholder="Search task names or details">
			</p>
			<p>
				<label for="task-filter">Show</label>
				<select id="task-filter">
					<option value="all">All tasks</option>
					<option value="active">Active tasks</option>
					<option value="completed">Completed tasks</option>
				</select>
			</p>
			<p id="task-count" aria-live="polite"></p>
			<ul id="task-list"></ul>
			<p id="empty-message">No tasks yet. Add one above to get started.</p>
			<p id="no-results-message" hidden>No tasks match your search.</p>
		</section>
	</main>

	<script>
		const storageKey = "student-task-manager-tasks";
		const form = document.querySelector("#task-form");
		const taskList = document.querySelector("#task-list");
		const searchInput = document.querySelector("#task-search");
		const filterSelect = document.querySelector("#task-filter");
		const taskCount = document.querySelector("#task-count");
		const emptyMessage = document.querySelector("#empty-message");
		const noResultsMessage = document.querySelector("#no-results-message");

		let tasks = loadTasks();

		function loadTasks() {
			try {
				const savedTasks = JSON.parse(localStorage.getItem(storageKey) || "[]");
				return Array.isArray(savedTasks) ? savedTasks : [];
			} catch {
				return [];
			}
		}

		function saveTasks() {
			localStorage.setItem(storageKey, JSON.stringify(tasks));
		}

		function renderTasks() {
			const query = searchInput.value.trim().toLowerCase();
			const status = filterSelect.value;
			const visibleTasks = tasks.filter((task) => {
				const matchesSearch = `${task.title} ${task.details}`.toLowerCase().includes(query);
				const matchesStatus = status === "all"
					|| (status === "active" && !task.completed)
					|| (status === "completed" && task.completed);
				return matchesSearch && matchesStatus;
			});

			taskList.replaceChildren();
			visibleTasks.forEach((task) => {
				const item = document.createElement("li");
				const heading = document.createElement("h3");
				heading.textContent = task.title;
				if (task.completed) {
					heading.append(" (Completed)");
				}
				item.append(heading);

				if (task.details) {
					const details = document.createElement("p");
					details.textContent = task.details;
					item.append(details);
				}

				const metadata = document.createElement("p");
				metadata.textContent = `Priority: ${task.priority}${task.dueDate ? ` | Due: ${task.dueDate}` : ""}`;
				item.append(metadata);

				const completeButton = document.createElement("button");
				completeButton.type = "button";
				completeButton.textContent = task.completed ? "Mark active" : "Mark done";
				completeButton.setAttribute("aria-label", `${task.completed ? "Mark active" : "Mark done"}: ${task.title}`);
				completeButton.addEventListener("click", () => {
					task.completed = !task.completed;
					saveTasks();
					renderTasks();
				});
				item.append(completeButton, " ");

				const deleteButton = document.createElement("button");
				deleteButton.type = "button";
				deleteButton.textContent = "Delete";
				deleteButton.setAttribute("aria-label", `Delete: ${task.title}`);
				deleteButton.addEventListener("click", () => {
					tasks = tasks.filter((savedTask) => savedTask.id !== task.id);
					saveTasks();
					renderTasks();
				});
				item.append(deleteButton);
				taskList.append(item);
			});

			const activeCount = tasks.filter((task) => !task.completed).length;
			taskCount.textContent = `${tasks.length} task${tasks.length === 1 ? "" : "s"} total, ${activeCount} active`;
			emptyMessage.hidden = tasks.length > 0;
			noResultsMessage.hidden = tasks.length === 0 || visibleTasks.length > 0;
		}

		form.addEventListener("submit", (event) => {
			event.preventDefault();
			const formData = new FormData(form);
			const title = String(formData.get("title")).trim();
			if (!title) {
				document.querySelector("#task-title").focus();
				return;
			}

			tasks.unshift({
				id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
				title,
				details: String(formData.get("details")).trim(),
				dueDate: String(formData.get("dueDate")),
				priority: String(formData.get("priority")),
				completed: false
			});
			saveTasks();
			form.reset();
			renderTasks();
			document.querySelector("#task-title").focus();
		});

		searchInput.addEventListener("input", renderTasks);
		filterSelect.addEventListener("change", renderTasks);
		renderTasks();
	</script>
</body>
</html>
