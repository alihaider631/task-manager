<!doctype html>

<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="A simple task manager for creating, searching, filtering, completing, and deleting tasks">

<title>Task Manager</title>

<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>

<body>
	<header class="site-header">
		<div class="container">
			<h1>Task Manager</h1>
			<p>Organize your tasks and keep track of what needs to be done.</p>
		</div>
	</header>

<main class="container">

	<section class="task-section" aria-labelledby="add-task-heading">
		<h2 id="add-task-heading">Add a Task</h2>

		<form id="task-form">

			<div class="form-group">
				<label for="task-title">Task</label>
				<input
					id="task-title"
					name="title"
					type="text"
					required
					maxlength="120"
					placeholder="What needs to be done?"
					autocomplete="off"
				>
			</div>

			<div class="form-group">
				<label for="task-details">Details <span>(optional)</span></label>
				<textarea
					id="task-details"
					name="details"
					rows="4"
					maxlength="500"
					placeholder="Add some details about this task..."
				></textarea>
			</div>

			<div class="form-row">

				<div class="form-group">
					<label for="task-due-date">Due Date <span>(optional)</span></label>
					<input
						id="task-due-date"
						name="dueDate"
						type="date"
					>
				</div>

				<div class="form-group">
					<label for="task-priority">Priority</label>
					<select id="task-priority" name="priority">
						<option value="Low">Low</option>
						<option value="Medium" selected>Medium</option>
						<option value="High">High</option>
					</select>
				</div>

			</div>

			<button type="submit" class="primary-button">
				Add Task
			</button>

		</form>
	</section>


	<section class="task-section" aria-labelledby="tasks-heading">

		<div class="section-header">
			<div>
				<h2 id="tasks-heading">Your Tasks</h2>
				<p id="task-count" aria-live="polite">
					0 tasks total, 0 active
				</p>
			</div>
		</div>


		<div class="task-controls">

			<div class="form-group">
				<label for="task-search">Search Tasks</label>
				<input
					id="task-search"
					type="search"
					placeholder="Search task names or details"
					autocomplete="off"
				>
			</div>

			<div class="form-group">
				<label for="task-filter">Show</label>
				<select id="task-filter">
					<option value="all">All Tasks</option>
					<option value="active">Active Tasks</option>
					<option value="completed">Completed Tasks</option>
				</select>
			</div>

		</div>


		<p
			id="task-error"
			class="error-message"
			role="alert"
			hidden
		></p>


		<div class="task-list-container">

			<ul
				id="task-list"
				aria-live="polite"
				aria-label="Task list"
			></ul>

			<p
				id="empty-message"
				class="empty-message"
			>
				No tasks yet. Add one above to get started.
			</p>

			<p
				id="no-results-message"
				class="empty-message"
				hidden
			>
				No tasks match your search or filter.
			</p>

		</div>

	</section>

</main>


<footer class="site-footer">
	<div class="container">
		<p>&copy; 2026 Task Manager</p>
	</div>
</footer>
</body>
</html>
